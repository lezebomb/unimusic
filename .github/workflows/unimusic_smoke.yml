name: UniMusic focused checks

on:
  push:
    branches: [main]
    paths:
      - 'modules/model/**'
      - 'modules/database/**'
      - 'modules/local/**'
      - 'modules/platform/**'
      - 'modules/playback/**'
      - 'modules/common/src/**/search/**'
      - 'modules/common/src/main/res/*/strings_search.xml'
      - 'modules/common/src/main/res/*/strings_unimusic*.xml'
      - 'app/src/main/res/*/strings_unimusic*.xml'
      - 'app/src/main/java/moe/ouom/neriplayer/ui/screen/nowplaying/actions/**'
      - 'app/src/main/java/moe/ouom/neriplayer/ui/navigation/UniMusicSections.kt'
      - 'app/src/main/java/moe/ouom/neriplayer/ui/NeriApp*.kt'
      - 'app/src/main/java/moe/ouom/neriplayer/ui/component/navigation/**'
      - 'app/src/main/java/moe/ouom/neriplayer/ui/screen/tab/library/**'
      - 'app/src/main/java/moe/ouom/neriplayer/ui/screen/tab/home/**'
      - 'app/src/main/java/moe/ouom/neriplayer/ui/viewmodel/tab/PlaylistImportViewModel.kt'
      - 'app/src/main/java/moe/ouom/neriplayer/ui/viewmodel/tab/HomeViewModel.kt'
      - 'app/src/main/java/moe/ouom/neriplayer/ui/viewmodel/tab/home/**'
      - 'app/src/test/java/moe/ouom/neriplayer/ui/viewmodel/tab/PlaylistImport*.kt'
      - 'app/src/test/java/moe/ouom/neriplayer/ui/screen/nowplaying/actions/SourceChoice*.kt'
      - 'app/src/main/java/moe/ouom/neriplayer/ui/viewmodel/tab/Explore*.kt'
      - 'app/src/main/java/moe/ouom/neriplayer/ui/screen/tab/explore/**'
      - 'app/src/test/java/moe/ouom/neriplayer/ui/viewmodel/tab/Explore*.kt'
      - 'app/src/test/java/moe/ouom/neriplayer/ui/screen/tab/Explore*.kt'
      - 'tools_pub/quality/module_boundaries.py'
      - 'config/quality/domain-dependencies.json'
      - 'app/src/main/java/moe/ouom/neriplayer/NeriPlayerApplication.kt'
      - 'app/src/main/java/moe/ouom/neriplayer/core/di/AppContainer.kt'
      - '.github/workflows/unimusic_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unimusic-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unified-library:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: ./.github/actions/android-ndk
      - name: Install pinned Android build packages
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0' 'cmake;3.31.6'
      - name: Check boundaries and changed behavior
        run: |
          chmod +x gradlew
          python3 -X utf8 tools_pub/quality/module_boundaries.py
          ./gradlew -Dorg.gradle.java.installations.paths="$JAVA_HOME_17_X64" \
            :build-logic:convention:test --tests '*CommonGitVersionTest' \
            :database:testDebugUnitTest --tests '*RegisteredMigrationChainTest' --tests '*NeriUserDataDatabaseVersionTest' --tests '*PlaylistImportMigrationTest' --tests '*SourceMatchMigrationTest' \
            :local:testDebugUnitTest --tests '*UnifiedLibraryRoomStoreTest' --tests '*PlaylistImportCoordinatorTest' --tests '*PlaylistImportAutoRefreshPolicyTest' --tests '*LocalPlaylistSyncMutationDecoderTest' --tests '*SourceMatchRoomStoreTest' --tests '*LocalRecommendationRankerTest' --tests '*DailyRecommendationStoreTest' --tests '*LocalRecommendationFeedbackStoreTest' --tests '*LocalPlaybackFeedbackStoreTest' --tests '*LocalArtistSummaryTest.artist build cancellation*' --tests '*UnifiedPlaybackRoomStoreTest' \
            :common:testDebugUnitTest --tests '*FederatedSearchEngineTest' \
            :app:testDebugUnitTest --tests '*ExploreCatalogSearchTest' --tests '*ExploreSearchResultRankingTest' --tests '*ExploreScreenYouTubeGateTest' --tests '*ExploreViewModelYouTubeGateTest' --tests '*ExploreSearchPaginationTest' --tests '*PlaylistImportUiPolicyTest' --tests '*SourceChoiceMetadataTest' --tests '*UniMusicSectionsTest' --tests '*NeriAppNavigationPresentationTest' --tests '*LibraryLocalSearchEngineTest' \
            :platform:testDebugUnitTest --tests '*NeteasePlaylistImportProviderTest' --tests '*BiliClientPlayUrlTest' --tests '*BiliClientVideoInfoTest' --tests '*NeteaseRequestSessionTest' --tests '*NeteaseClientTest' --tests '*KuwoCatalogProviderTest' --tests '*KuwoAudioClientTest' --tests '*QQMusicAudioClientTest' --tests '*QQMusicAuthRepositoryTest' --tests '*YouTubePlaybackHttpCancellationTest' --tests '*YouTubeAnonymousAccessTest' --tests '*YouTubePlaybackBootstrapOwnerTest' --tests '*YouTubeMusicPlaybackRepositoryTest.getBestPlayableAudio_usesInjectedCipherResolverForPlayerApiDirectStream' --tests '*YouTubeMusicPlaybackRepositoryTest.kickoffPlayableAudioPrefetch_reusesInflightResolutionForImmediatePlayback' --tests '*YouTubeMusicClientBrowseTest.video metadata*' --tests '*YouTubeMusicClientPlaybackSearchTest.song and video searches*' --tests '*YouTubeMusicClientPlaybackSearchTest.search follows continuation*' \
            :playback:logic:testDebugUnitTest --tests '*RecordingMatchPolicyTest' --tests '*PlaybackSourceResolverTest' --tests '*SourceResolutionBudgetTest' --tests '*SourceAvailabilityCheckerTest' --tests '*RecordingDiscoveryRankerTest' --tests '*AutomaticCatalogChoiceTest' --tests '*SongUrlResolutionRetryTest' --tests '*PlaybackFeedbackTrackerTest' --tests '*PlaybackStatsOwnerTest.feedback follows*' \
            :playback:runtime:testDebugUnitTest --tests '*AppPlaybackStatsWritePortTest.ready player dependencies*' --tests '*AppPlaybackStatsWritePortTest.safe mode uses*' --tests '*BiliRecordingMatchTest' --tests '*RememberedSourceMetadataTest' --tests '*GenericUrlPrefetchHandoffTest.decision bound*' --tests '*BiliVideoSkipPlaybackControllerTest.alternate sources*' --tests '*PlayerManagerNeteaseAutoSourceSwitchTest' --tests '*PlayerManagerNeteaseLocalFallbackTest' \
            :platform:verifyDomainDependencies :database:assembleDebugAndroidTest --max-workers=2 --console=plain
      - name: Enable KVM
        run: |
          sudo sh -c 'echo "KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify additive migration on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew -Dorg.gradle.java.installations.paths="$JAVA_HOME_17_X64" :database:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=moe.ouom.neriplayer.data.local.database.UnifiedLibraryMigrationTest --max-workers=2 --console=plain
            mkdir -p build/unimusic-migration-preservation
            find modules/database/build/outputs/androidTest-results -name '*.xml' -exec cp '{}' build/unimusic-migration-preservation/ \;
            ./gradlew -Dorg.gradle.java.installations.paths="$JAVA_HOME_17_X64" :database:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=moe.ouom.neriplayer.data.local.database.DatabaseUpgradeInstrumentedTest --max-workers=2 --console=plain
      - name: Save focused reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unimusic-focused-reports
          path: |
            build-logic/convention/build/test-results/**/*.xml
            modules/database/build/test-results/**/*.xml
            modules/local/build/test-results/**/*.xml
            modules/platform/build/test-results/**/*.xml
            modules/common/build/test-results/**/*.xml
            app/build/test-results/**/*.xml
            modules/playback/logic/build/test-results/**/*.xml
            modules/playback/runtime/build/test-results/**/*.xml
            modules/database/build/outputs/androidTest-results/**
            build/unimusic-migration-preservation/**
          if-no-files-found: ignore

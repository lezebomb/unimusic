name: UniMusic focused checks

on:
  push:
    branches: [main]
    paths:
      - 'modules/model/**'
      - 'modules/database/**'
      - 'modules/local/**'
      - 'modules/platform/**'
      - 'app/src/main/java/moe/ouom/neriplayer/NeriPlayerApplication.kt'
      - '.github/workflows/unimusic_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unimusic-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unified-library:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: ./.github/actions/android-ndk
      - name: Install pinned Android build packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'cmake;3.31.6'
      - name: Check boundaries and changed behavior
        run: |
          chmod +x gradlew
          python3 -X utf8 tools_pub/quality/module_boundaries.py
          ./gradlew -Dorg.gradle.java.installations.paths="$JAVA_HOME_17_X64" \
            :database:testDebugUnitTest --tests '*RegisteredMigrationChainTest' --tests '*NeriUserDataDatabaseVersionTest' \
            :local:testDebugUnitTest --tests '*UnifiedLibraryRoomStoreTest' \
            :platform:testDebugUnitTest --tests '*NeteasePlaylistImportProviderTest' \
            :database:assembleDebugAndroidTest --max-workers=2 --console=plain
      - name: Enable KVM
        run: |
          sudo sh -c 'echo "KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify additive migration on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew -Dorg.gradle.java.installations.paths="$JAVA_HOME_17_X64" :database:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=moe.ouom.neriplayer.data.local.database.UnifiedLibraryMigrationTest --max-workers=2 --console=plain
            mkdir -p build/unimusic-migration-preservation
            find modules/database/build/outputs/androidTest-results -name '*.xml' -exec cp '{}' build/unimusic-migration-preservation/ \;
            ./gradlew -Dorg.gradle.java.installations.paths="$JAVA_HOME_17_X64" :database:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=moe.ouom.neriplayer.data.local.database.DatabaseUpgradeInstrumentedTest --max-workers=2 --console=plain
      - name: Save focused reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unimusic-focused-reports
          path: |
            modules/database/build/test-results/**/*.xml
            modules/local/build/test-results/**/*.xml
            modules/platform/build/test-results/**/*.xml
            modules/database/build/outputs/androidTest-results/**
            build/unimusic-migration-preservation/**
          if-no-files-found: ignore
